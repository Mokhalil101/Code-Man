<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101827"><title>CODE MAN — Powered by GDG Assiut</title>
<link rel="stylesheet" href="styles/main.css"><link rel="stylesheet" href="styles/game.css"><link rel="stylesheet" href="styles/quiz.css"><link rel="stylesheet" href="styles/responsive.css">
</head><body>
<div id="app">
  <div id="hud" hidden>
    <div class="hud-row">
      <div class="hud-item"><span>SCORE</span><b id="h-score">0</b></div><div class="hud-item"><span>LIVES</span><b id="h-lives" class="hearts"></b></div>
      <div class="hud-item"><span>XP</span><b id="h-xp">0</b></div><div class="hud-item wide"><span>WORLD</span><b id="h-world"></b></div>
      <div class="hud-item"><span>BITS</span><b id="h-bits">0</b></div><div class="hud-item"><span>TIME</span><b id="h-time">0:00</b></div>
      <button id="h-pause" class="btn small" aria-label="Pause">❚❚</button>
    </div>
    <div class="hud-row"><div id="h-powers"></div></div>
    <div id="h-boss" hidden><div class="boss-name"></div><div class="bar"><i></i></div><div class="boss-phase"></div></div>
  </div>
  <div id="game"></div>
  <div id="joy" hidden><div class="pad"><div class="knob"></div></div><button id="j-dash" class="btn primary">DASH</button></div>
</div>
<div id="screens" hidden></div><div id="bgcode"></div><div id="banner" hidden></div><div id="toasts"></div><div id="modal" hidden></div>
<div id="quiz" hidden><div class="box"></div></div>
<div id="loader"><div class="ld-inner">
  <h1 class="logo"><span style="color:#4285F4">C</span><span style="color:#EA4335">O</span><span style="color:#FBBC04">D</span><span style="color:#34A853">E</span> <span style="color:#4285F4">M</span><span style="color:#EA4335">A</span><span style="color:#FBBC04">N</span></h1>
  <div class="tagline">Eat Code. Escape Bugs. Master Programming.</div>
  <div class="gdg-tag"><span class="gdg-dots"><i style="background:#4285F4"></i><i style="background:#EA4335"></i><i style="background:#FBBC04"></i><i style="background:#34A853"></i></span><span>Powered by </span><b>GDG Assiut</b></div>
  <div id="ld-bar"><i></i></div><div id="ld-pct">0%</div><div id="ld-msg">Loading assets…</div>
  <button id="ld-start" class="btn primary" hidden>▶ PRESS START</button>
</div></div>
<script src="lib/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/systems/Save.js"></script><script src="src/systems/AudioManager.js"></script><script src="src/systems/Pathfinding.js"></script>
<script src="src/systems/QuestionManager.js"></script><script src="src/systems/Progress.js"></script><script src="src/entities/Mover.js"></script>
<script src="src/ui/Quiz.js"></script><script src="src/ui/UI.js"></script>
<script src="src/scenes/PreloadScene.js"></script><script src="src/scenes/GameScene.js"></script><script src="src/main.js"></script>
</body></html>
