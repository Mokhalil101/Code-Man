<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1B1340">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="icon" href="assets/icons/icon-192.png">
<title>CODE MAN — Powered by GDG Assiut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles/main.css"><link rel="stylesheet" href="styles/game.css"><link rel="stylesheet" href="styles/quiz.css"><link rel="stylesheet" href="styles/responsive.css">
</head><body>
<div id="app">
  <div id="hud" hidden>
    <div class="hud-bar">
      <div class="hud-score"><span>SCORE</span><b id="h-score">0</b></div>
      <div id="h-lives" class="hud-lives" role="img" aria-label="3 lives"></div>
      <div class="hud-pill hud-bits" title="Code Bits collected"><i aria-hidden="true"></i><b id="h-bits">0</b></div>
      <div class="hud-pill hud-xp" title="XP earned this run"><span>XP</span><b id="h-xp">0</b></div>
      <div id="h-powers"></div>
      <div class="hud-gap"></div>
      <div class="hud-pill hud-world"><b id="h-world"></b></div>
      <div id="h-boss" hidden><img class="boss-ico" src="assets/sprites/boss1.png" alt=""><div class="boss-info"><div class="boss-name"></div><div class="bar"><i></i></div><div class="boss-phase"></div></div></div>
      <b id="h-time" class="hud-time">0:00</b>
      <button class="btn icon" data-fs aria-label="Fullscreen" hidden></button>
      <button id="h-pause" class="btn icon" aria-label="Pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    </div>
  </div>
  <div id="game"></div>
  <div id="joy" hidden><div class="pad"><div class="knob"></div></div><button id="j-dash" class="btn primary">DASH</button></div>
</div>
<button id="fs-btn" class="btn icon" data-fs aria-label="Fullscreen" hidden></button>
<div id="screens" hidden></div><div id="bgcode" aria-hidden="true"></div><div id="banner" hidden></div><div id="toasts"></div><div id="modal" hidden></div>
<div id="quiz" hidden><div class="q-wrap"><div class="q-badge"><span>?</span>QUIZ TIME!</div><div class="box"></div></div><div class="q-mascot" aria-hidden="true"><span class="q-say">Hmm…</span><span class="cm-hero"><i class="cm-eye"></i></span></div></div>
<div id="loader"><div class="ld-inner">
  <div class="gdg-tag"><span class="gdg-dots"><i style="background:#4285F4"></i><i style="background:#EA4335"></i><i style="background:#FBBC04"></i><i style="background:#34A853"></i></span><span>Powered by </span><b>GDG Assiut</b></div>
  <h1 class="logo"><span class="lg-row"><span class="lc-b">C</span><span class="lc-r">O</span><span class="lc-y">D</span><span class="lc-g">E</span></span><span class="lg-row lg-man">MAN</span></h1>
  <div class="tagline">Gobble code. Dodge bugs. Become a Code Legend!</div>
  <div id="ld-bar"><i></i></div><div id="ld-pct">0%</div><div id="ld-msg">Loading assets…</div>
  <button id="ld-start" class="btn primary play" hidden><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>PLAY</button>
  <div class="ld-hint">or press any key</div>
</div></div>
<script src="lib/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/systems/Save.js"></script><script src="src/systems/Fullscreen.js"></script><script src="src/systems/AudioManager.js"></script><script src="src/systems/Pathfinding.js"></script>
<script src="src/systems/QuestionManager.js"></script><script src="src/systems/Progress.js"></script><script src="src/entities/Mover.js"></script>
<script src="src/ui/Quiz.js"></script><script src="src/ui/UI.js"></script>
<script src="src/scenes/PreloadScene.js"></script><script src="src/scenes/GameScene.js"></script><script src="src/systems/Gamepad.js"></script><script src="src/main.js"></script>
</body></html>
